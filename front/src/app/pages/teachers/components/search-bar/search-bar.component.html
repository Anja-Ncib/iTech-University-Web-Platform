<div class="bg-white rounded-xl shadow-sm border border-slate-200/50 p-6 m-5">
  <!-- Search Header -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-gradient-to-br from-[#083E86] to-[#265694] rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>
    
    <!-- Search Actions -->
    <div class="flex items-center space-x-3">
      <button 
        type="button"
        (click)="clearAll()"
        class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 hover:bg-slate-50 rounded-lg transition-all duration-200"
      >
        {{'search-clearAll'|translate}}
      </button>
    </div>
  </div>

  <!-- Search Form -->
   <form [formGroup]="searchForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
  
  
    
    <!-- Name Field -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-slate-700">
        {{ 'search-bar-name' | translate }}
      </label>
      <div class="relative">
        <input 
          type="text" 
          placeholder="{{ 'search-bar-name' | translate }}" 
          formControlName="name"
          class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg shadow-sm text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#00A099] focus:border-transparent transition-all duration-200 hover:border-slate-300"
        />
        <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
    </div>

    <!-- CIN Field -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-slate-700">CIN</label>
      <div class="relative">
        <input 
          type="text" 
          placeholder="CIN" 
          formControlName="cin"
          class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg shadow-sm text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#00A099] focus:border-transparent transition-all duration-200 hover:border-slate-300"
          
        />
        <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/>
        </svg>
      </div>
      <div *ngIf="searchForm.get('cin')?.errors?.['invalidCharacters']" class="flex items-center space-x-1 text-red-600 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ 'cin-error-character' | translate }}</span>
      </div>
      <div *ngIf="searchForm.get('cin')?.errors?.['tooLong']" class="flex items-center space-x-1 text-red-600 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ 'cin-error-length' | translate }}</span>
      </div>
    </div>

    <!-- Email Field -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-slate-700">Email</label>
      <div class="relative">
        <input 
          type="email" 
          placeholder="Email" 
          formControlName="email"
          class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg shadow-sm text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#00A099] focus:border-transparent transition-all duration-200 hover:border-slate-300"
          
        />
        <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
        </svg>
      </div>
      <div *ngIf="searchForm.get('email')?.invalid && (searchForm.get('email')?.touched || searchForm.get('email')?.dirty)" class="flex items-center space-x-1 text-red-600 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ 'email-error' | translate }}</span>
      </div>
    </div>

    <!-- Grade Select -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-slate-700">{{ 'search-bar-grad' | translate }}</label>
      <div class="relative">
        <select 
          formControlName="grad"
          class="w-full pl-10 pr-10 py-3 border border-slate-200 rounded-lg shadow-sm text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-[#00A099] focus:border-transparent transition-all duration-200 hover:border-slate-300 cursor-pointer"
        >
          <option disabled selected value="">{{ 'search-bar-grad' | translate }}</option>
          <option *ngFor="let option of gradOptions" [value]="option.value">
            {{ option.display }}
          </option>
          </select>
        <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
        </svg>
        <svg class="absolute right-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
    </div>

    <!-- Department Select -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-slate-700">{{ 'search-bar-department' | translate }}</label>
      <div class="relative">
        <select 
          formControlName="department"
          class="w-full pl-10 pr-10 py-3 border border-slate-200 rounded-lg shadow-sm text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-[#00A099] focus:border-transparent transition-all duration-200 hover:border-slate-300 cursor-pointer"
        >
          <option disabled selected value="">{{ 'search-bar-department' | translate }}</option>
          <option *ngFor="let option of departmentOptions" [value]="option.value">
    {{ option.display }}
  </option>
        </select>
        <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        <svg class="absolute right-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
    </div>

    <!-- Employment Year -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-slate-700">{{ 'search-bar-employment' | translate }}</label>
      <div class="relative">
        <input 
          type="number" 
          placeholder="{{ 'search-bar-employment' | translate }}" 
          [formControl]="dateEmploy"
          class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg shadow-sm text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#00A099] focus:border-transparent transition-all duration-200 hover:border-slate-300"
        />
        <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2-2v2m8 0H8m8 0v2a2 2 0 01-2 2H10a2 2 0 01-2-2V6"/>
        </svg>
      </div>
      <div *ngIf="dateEmploy.errors?.['maxYear'] && (dateEmploy.touched || dateEmploy.dirty)" class="flex items-center space-x-1 text-red-600 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ 'employment-error' | translate }}</span>
      </div>
    </div>

    <!-- Birth Year -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-slate-700">{{ 'search-bar-birth' | translate }}</label>
      <div class="relative">
        <input 
          type="number" 
          placeholder="{{ 'search-bar-birth' | translate }}" 
          [formControl]="dateBirth"
          class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg shadow-sm text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#00A099] focus:border-transparent transition-all duration-200 hover:border-slate-300"
          
        />
        <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
      <div *ngIf="dateBirth.errors?.['maxYear'] && (dateBirth.touched || dateBirth.dirty)" class="flex items-center space-x-1 text-red-600 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ 'birth-error' | translate }}</span>
      </div>
    </div>
    </form>
  </div>
