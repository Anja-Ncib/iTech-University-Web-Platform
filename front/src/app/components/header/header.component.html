<header class="w-full h-20 px-6 flex justify-between items-center bg-white border-b border-slate-200/50 shadow-sm backdrop-blur-sm">
  <!-- Left side - Logo/Brand (optional) -->
  <div class="flex items-center">
    <div class="w-8 h-8 bg-gradient-to-br from-[#083E86] to-[#265694] rounded-lg flex items-center justify-center">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <span class="ml-3 text-lg font-semibold text-slate-800 hidden md:block">{{ 'dashboard' | translate }}</span>
  </div>

  <!-- Right side - Controls -->
  <div class="flex items-center space-x-4">

    <!-- Language Dropdown -->
    <div class="relative">
      <select
        [(ngModel)]="selectedLanguage"
        (change)="changeLanguage($event)"
        class="appearance-none bg-white border border-slate-200 rounded-lg px-4 py-2 pr-8 text-sm font-medium text-slate-700 hover:border-[#00A099] focus:outline-none focus:ring-2 focus:ring-[#00A099] focus:border-transparent transition-all duration-200 cursor-pointer"
      >
        <option *ngFor="let lang of languages" [value]="lang.value">
          {{ lang.label }}
        </option>
      </select>
      <svg class="absolute right-2 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>

    <!-- Notification Bell -->
    <div class="relative group cursor-pointer">
      <div class="p-2 rounded-lg hover:bg-slate-50 transition-colors duration-200">
        <svg class="w-6 h-6 text-slate-600 group-hover:text-[#083E86] transition-colors duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <!-- Notification Badge -->
        <span class="absolute -top-0.5 -right-0.5 w-5 h-5 bg-gradient-to-r from-red-500 to-red-600 text-white text-xs font-bold rounded-full flex items-center justify-center border-2 border-white shadow-sm">
          3
        </span>
      </div>
      
      <!-- Notification Dropdown (optional enhancement) -->
      <div class="absolute right-0 top-full mt-2 w-80 bg-white rounded-lg shadow-lg border border-slate-200 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
        <div class="p-4 border-b border-slate-200">
          <h3 class="font-semibold text-slate-800">Notifications</h3>
        </div>
        <div class="max-h-64 overflow-y-auto">
          <div class="p-3 hover:bg-slate-50 border-b border-slate-100 cursor-pointer">
            <div class="flex items-start space-x-3">
              <div class="w-2 h-2 bg-[#00A099] rounded-full mt-2 flex-shrink-0"></div>
              <div>
                <p class="text-sm text-slate-800 font-medium">New student registered</p>
                <p class="text-xs text-slate-500 mt-1">2 minutes ago</p>
              </div>
            </div>
          </div>
          <div class="p-3 hover:bg-slate-50 border-b border-slate-100 cursor-pointer">
            <div class="flex items-start space-x-3">
              <div class="w-2 h-2 bg-[#265694] rounded-full mt-2 flex-shrink-0"></div>
              <div>
                <p class="text-sm text-slate-800 font-medium">Course schedule updated</p>
                <p class="text-xs text-slate-500 mt-1">1 hour ago</p>
              </div>
            </div>
          </div>
        </div>
        <div class="p-3 border-t border-slate-200">
          <button class="w-full text-center text-sm text-[#083E86] hover:text-[#265694] font-medium transition-colors">
            View all notifications
          </button>
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown -->
    <div class="relative group">
      <div class="flex items-center space-x-3 cursor-pointer p-2 rounded-lg hover:bg-slate-50 transition-colors duration-200">
        <div class="w-8 h-8 bg-gradient-to-br from-[#00A099] to-[#265694] rounded-full flex items-center justify-center">
          <span class="text-white text-sm font-semibold">JD</span>
        </div>
        <div class="hidden md:block text-left">
          <p class="text-sm font-medium text-slate-800">John Doe</p>
          <p class="text-xs text-slate-500">{{'admin' | translate}}</p>
        </div>
        <svg class="w-4 h-4 text-slate-400 group-hover:text-slate-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>

      <!-- User Dropdown Menu -->
      <div class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-slate-200 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
        <div class="p-2">
          <a href="#" class="flex items-center px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 rounded-md transition-colors">
            <svg class="w-4 h-4 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Profile
          </a>
          <a href="#" class="flex items-center px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 rounded-md transition-colors">
            <svg class="w-4 h-4 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            {{'side-bar-settings' | translate}}
          </a>
          <hr class="my-2 border-slate-200">
          <a href="#" class="flex items-center px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-md transition-colors">
            <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
           {{'side-bar-logout' | translate}}
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
